<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokeHome Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>PokeHome Tracker</h1>
    <input type="text" id="search-input" placeholder="Search Pokémon by name or ID...">

    <label><input type="checkbox" id="owned-filter"> Show only owned Pokémon</label>
    <p id="owned-counter">Owned: 0 / 1025</p>
    
    <div class="progress-bar">
        <div id="progress-fill"></div>
    </div>

    <button id="export-button">
        Export Collection
    </button>

    <button id="import-button">
        Import Collection
    </button>

    <button id="reset-button">
        Reset Collection
    </button>

    <input type="file" id="import-file" accept=".json" style="display: none;">

    <div id="pokemon-container"></div>
    <p id="loading-message">Loading Pokémon... 0 / 1025</p>
    <div id="pokemon-container"></div>
    <div id="scroll-trigger"></div>
    
    <script src="js/script.js"></script>
</body>
</html>
